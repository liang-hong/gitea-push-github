# =====================================================================
# 本仓库自身的 Gitea -> GitHub 同步流水线（手工复制示例）
#
# 注意：provision 工具注入目标仓库使用的是 templates/woodpecker.yml；
#       本文件是模板的“已填充”示例，仅用于本仓库自身或手工复制。
#
# 默认不同步：仓库根目录未提供 .github-sync.yml（或 enabled != true）时跳过。
# GitHub 云端仓库默认私有（.github-sync.yml 中 github.private 可覆盖）。
#
# 使用前请修改以下两处为本机实际值：
#   image         已构建并推送的同步工具镜像（见 README「构建并推送同步工具镜像」）
#   SECRETS_MOUNT 宿主机上存放 gitea-push-github.env 的目录（只读挂载）
# =====================================================================

when:
  event: push

steps:
  github-sync:
    image: ghcr.io/<your-account>/gitea-github-sync:latest
    volumes:
      - /home/<your-user>/.config/gitea-push-github:/run/secrets/gitea-push-github:ro
    commands:
      # 注意：Woodpecker 会预处理参数表达式，内置变量需用 $$ 转义
      - gitea_github_sync.py --repo-owner "$${CI_REPO_OWNER}" --repo-name "$${CI_REPO_NAME}"

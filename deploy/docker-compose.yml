# Woodpecker CI (Server + Agent) 部署编排
# 用法: 编辑下方环境变量后执行 `docker compose up -d`
# 详细步骤见 README.md 第 5 节「部署 Woodpecker CI」
services:
  woodpecker-server:
    image: woodpeckerci/woodpecker-server:latest
    container_name: woodpecker-server
    ports:
      - "8000:8000" # Web 界面 (HTTP)
    environment:
      # ---- 与 Gitea 集成 ----
      WOODPECKER_GITEA: "true"
      WOODPECKER_GITEA_URL: "https://git.example.com" # 替换为你的 Gitea 地址
      WOODPECKER_GITEA_CLIENT: "xxxxxxxx" # Gitea OAuth2 Client ID
      WOODPECKER_GITEA_SECRET: "yyyyyyyy" # Gitea OAuth2 Client Secret
      # ---- 实例配置 ----
      WOODPECKER_OPEN: "true" # 允许用户注册（按需调整）
      WOODPECKER_HOST: "http://woodpecker.example.com:8000" # 对外访问地址
      WOODPECKER_ADMIN: "gitea_username" # 管理员用户名（可选）
      # ---- Agent 通信 ----
      WOODPECKER_AGENT_SECRET: "change-me-agent-secret"
    volumes:
      - woodpecker-server-data:/var/lib/woodpecker
    restart: unless-stopped

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:latest
    container_name: woodpecker-agent
    command: agent
    environment:
      WOODPECKER_SERVER: "woodpecker-server:9000"
      WOODPECKER_AGENT_SECRET: "change-me-agent-secret"
      WOODPECKER_MAX_WORKFLOWS: "2"
    volumes:
      # Agent 通过 Docker 套接字运行流水线容器
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  woodpecker-server-data:

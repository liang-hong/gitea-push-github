# =====================================================================
# 仓库级 Gitea -> GitHub 同步流水线模板
#
# 本文件由 provision/add_woodpecker_yml.py 注入到缺失该文件的 Gitea 仓库。
#
# 默认行为：
#   1. 默认【不同步】到 GitHub：仓库根目录未提供 .github-sync.yml，
#      或其中 github.enabled != true 时，本流水线直接跳过（幂等，退出码 0）。
#   2. 开启同步后，GitHub 云端仓库默认【私有】；如需公开，请在
#      .github-sync.yml 中显式设置 github.private: false。
#
# 凭据不写入本文件：
#   GitHub PAT 与 Gitea API Token 保存在服务器本地
#   ~/.config/gitea-push-github/gitea-push-github.env（权限 600），
#   通过下方卷挂载以只读方式注入容器。请勿把任何 Token 放进仓库文件。
#
# 注：{{SYNC_IMAGE}} / {{SECRETS_MOUNT}} 为 provision 工具的占位符，
#     会替换为本地凭据文件中的 SYNC_IMAGE 与 SECRETS_MOUNT。
# =====================================================================

when:
  event: push

steps:
  github-sync:
    image: {{SYNC_IMAGE}}
    volumes:
      - {{SECRETS_MOUNT}}:/run/secrets/gitea-push-github:ro
    commands:
      # 注意：Woodpecker 会预处理参数表达式，内置变量需用 $$ 转义
      - gitea_github_sync.py --repo-owner "$${CI_REPO_OWNER}" --repo-name "$${CI_REPO_NAME}"

# 仓库级 Gitea -> GitHub 同步配置
#
# github.state 合法值：
#   enable   - 创建/补齐：GitHub 无同名仓库则创建；Gitea Push Mirror 缺失则创建（保留已存在者）
#   suspend  - 停止更新：删除指向本方案 GitHub 仓库的 Gitea Push Mirror；GitHub 仓库保留不删
#   remove   - 不受本方案管理（等同 disable）：不创建也不删除 GitHub 仓库 / Push Mirror
#   disable  - 同 remove（默认值；文件缺失或未写 state 时等同此值）
#
# 注意：state 写成其他任何值（如 foo / true）都会导致脚本报错（退出码 1）。
#
# 多分支仓库：仅当全部分支都有本文件且内容一致（忽略注释）时才执行策略；
# 任一分支缺失或不一致 → 按 disable 处理（不报错）。请同步所有分支。
github:
  state: enable    # 本仓库启用同步
  private: false   # 云端仓库公开
